services:
  # -----------------------------------------------------------------
  # TROPIGO AI - WEB (Next.js) + WORKER (WhatsApp Baileys)
  # La base de datos es Supabase (externa). No se levanta PostgreSQL local.
  # -----------------------------------------------------------------
  web:
    image: ${DOCKER_IMAGE:-ghcr.io/jhosepcs/tropigo-ai:latest}
    build:
      context: .
      target: runner
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    image: ${DOCKER_IMAGE:-ghcr.io/jhosepcs/tropigo-ai:latest}
    build:
      context: .
      target: runner
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "false"
      WORKER_PORT: "3001"
      WHATSAPP_SESSION_PERSIST: "true"
    command: ["npx", "tsx", "src/worker/index.ts"]
    volumes:
      - whatsapp_session:/app/data/whatsapp_session
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  whatsapp_session:
