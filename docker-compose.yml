services:
  # 1. Base de datos PostgreSQL para producción
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atiende_lumen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atiende_lumen}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Proceso Web (Panel, API, OAuth Google, Chat Web)
  web:
    image: ${DOCKER_IMAGE:-ghcr.io/usuario/atiende:latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-atiende_lumen}?schema=public
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@atiende.es}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-anthropic/claude-haiku-5.5}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - SEED_DEMO=${SEED_DEMO:-true}
    volumes:
      - whatsapp_session:/app/data/whatsapp_session
    networks:
      - internal
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME:-atiende-clinica-lumen}.rule=Host(`${SUBDOMAIN}`)"
      - "traefik.http.routers.${PROJECT_NAME:-atiende-clinica-lumen}.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME:-atiende-clinica-lumen}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${PROJECT_NAME:-atiende-clinica-lumen}.loadbalancer.server.port=3000"

  # 3. Proceso Worker (Socket Baileys, Recordatorios, Resumen Diario)
  worker:
    image: ${DOCKER_IMAGE:-ghcr.io/usuario/atiende:latest}
    restart: always
    command: ["node", "src/worker/index.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-atiende_lumen}?schema=public
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WHATSAPP_SESSION_DIR=/app/data/whatsapp_session
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-anthropic/claude-haiku-5.5}
    volumes:
      - whatsapp_session:/app/data/whatsapp_session
    networks:
      - internal

volumes:
  pgdata:
  whatsapp_session:

networks:
  internal:
  traefik-proxy:
    external: true
